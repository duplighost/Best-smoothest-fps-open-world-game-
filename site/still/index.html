<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="STILL — a house, and what is under it. Headphones. Alone. In the dark." />
<title>STILL</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    transition: opacity 1400ms ease; pointer-events: none; opacity: 0;
    background: #000;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  #title h1 {
    font-size: clamp(50px, 10vw, 110px); font-weight: 400; letter-spacing: 0.55em;
    margin-right: -0.55em; color: #4a4642;
    animation: titlebreathe 7s ease-in-out infinite;
  }
  @keyframes titlebreathe { 0%,100% { opacity: 0.5; } 50% { opacity: 0.9; } }
  #title .sub {
    margin-top: 26px; font-size: 12px; letter-spacing: 0.5em; margin-right: -0.5em;
    color: #2e2b28; text-transform: uppercase;
  }
  #title .begin {
    margin-top: 11vh; font-size: 13px; letter-spacing: 0.4em; margin-right: -0.4em;
    color: #57524c; text-transform: uppercase; animation: titlebreathe 3.5s ease-in-out infinite;
  }
  #title .warn {
    position: absolute; bottom: 5vh; font-size: 11px; letter-spacing: 0.3em; margin-right: -0.3em;
    color: #2a2724; text-transform: uppercase;
  }

  #pause { background: rgba(0,0,0,0.88); }
  #pause .begin { font-size: 13px; letter-spacing: 0.4em; color: #57524c; text-transform: uppercase; animation: titlebreathe 3.5s ease-in-out infinite; }

  /* the game never says much. when it does, it whispers. */
  #whisper {
    position: fixed; left: 50%; bottom: 17vh; transform: translateX(-50%);
    font-size: 15px; letter-spacing: 0.42em; margin-right: -0.42em; text-transform: uppercase;
    color: rgba(160, 148, 136, 0.85); text-shadow: 0 0 18px rgba(0,0,0,1);
    opacity: 0; transition: opacity 2000ms ease; white-space: nowrap; z-index: 12;
    pointer-events: none;
  }

  /* interaction cue: a small pale ring, nothing more */
  #hand {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px;
    border-radius: 50%; background: rgba(200, 190, 175, 0.5);
    opacity: 0; transition: opacity 300ms ease, transform 300ms ease; z-index: 12; pointer-events: none;
  }
  #hand.on { opacity: 1; transform: scale(2.2); }
  #hand.key { background: rgba(220, 200, 160, 0.9); }

  #fader { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 15; transition: opacity 1200ms ease; }
  #grab {
    position: fixed; inset: 0; pointer-events: none; z-index: 14; opacity: 0; background: #000;
  }

  /* vignette + closing-eye tunnel — driven from JS via CSS vars */
  #tunnel {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: radial-gradient(ellipse at center,
      transparent calc(46% - var(--tun, 0%)),
      rgba(0, 0, 0, 0.88) calc(96% - var(--tun, 0%)));
  }

  /* the held-gaze meter for the ending: a thin pale line, filling */
  #gaze {
    position: fixed; left: 50%; bottom: 10vh; transform: translateX(-50%);
    width: 180px; height: 1px; background: rgba(120, 110, 100, 0.25);
    opacity: 0; transition: opacity 800ms ease; z-index: 12; pointer-events: none;
  }
  #gaze > div { height: 100%; width: 0%; background: rgba(220, 205, 185, 0.8); }

  #end { background: #000; z-index: 30; transition-duration: 3000ms; }
  #end .line {
    font-size: 16px; letter-spacing: 0.5em; margin-right: -0.5em; text-transform: uppercase;
    color: #6a6259; opacity: 0; transition: opacity 3000ms ease;
  }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="tunnel"></div>
<div id="whisper"></div>
<div id="hand"></div>
<div id="gaze"><div></div></div>
<div id="grab"></div>
<div id="fader"></div>

<div id="title" class="overlay show">
  <h1>STILL</h1>
  <div class="sub">a house &middot; and what is under it</div>
  <div class="begin">click, if you're sure</div>
  <div class="warn">headphones &middot; darkness &middot; alone</div>
</div>

<div id="pause" class="overlay">
  <div class="begin">it is waiting for you</div>
</div>

<div id="end" class="overlay">
  <div class="line" id="endline">you looked. that was all it wanted.</div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
